name: Build Horizontal Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip Horizontal-Launcher-v0.1.0-source.zip -d project

      - name: Build APK
        run: |
          cd project/HorizontalLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizontal-Launcher-APK
          path: project/HorizontalLauncher/app/build/outputs/apk/debug/app-debug.apk
